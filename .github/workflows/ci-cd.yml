
name: HR-system CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend/app

      - name: Validate Docker Compose
        run: docker compose config -q

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Deploy HR System locally
        shell: powershell
        working-directory: C:\Users\devil\OneDrive\Desktop\System_HR
        run: |
          Write-Host "Updating local repository..."

          git pull origin main

          Write-Host "Checking Docker Compose configuration..."

          docker compose config -q

          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose configuration is invalid"
          }

          Write-Host "Building and starting HR System..."

          docker compose up -d --build --remove-orphans

          if ($LASTEXITCODE -ne 0) {
              throw "Docker Compose deployment failed"
          }

          Write-Host "Checking containers..."

          docker compose ps

          Write-Host "Local deployment completed"

